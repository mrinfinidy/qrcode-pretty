name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Existing bare version tag to recover (never moved)
        required: true
        type: string
      artifact_run:
        description: Completed original Release run ID containing release-bundle
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      release: ${{ steps.resolve.outputs.release }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      artifact_run: ${{ steps.resolve.outputs.artifact_run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Identify release merge or verified recovery
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release/release.py resolve

  checks:
    needs: resolve
    if: needs.resolve.outputs.release == 'true' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.5'
      - run: |
          uv sync --locked
          uv run --locked pytest

  tag:
    needs: [resolve, checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create or verify immutable source tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            test "$(git rev-parse "refs/tags/$VERSION^{commit}")" = "$SOURCE_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$VERSION" -f sha="$SOURCE_SHA"
          fi

  build:
    needs: [resolve, tag]
    uses: ./.github/workflows/build-release.yaml
    with:
      sha: ${{ needs.resolve.outputs.sha }}
      local_source: false

  publish:
    needs: [resolve, build]
    if: >-
      ${{ !cancelled() && needs.resolve.result == 'success' &&
          needs.resolve.outputs.release == 'true' &&
          (needs.build.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    environment: release
    concurrency:
      group: publish-${{ needs.resolve.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.5'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-bundle
          path: bundle
          run-id: ${{ needs.resolve.outputs.artifact_run }}
          github-token: ${{ github.token }}
      - name: Verify original artifact identity and checksums
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          ARTIFACT_RUN: ${{ needs.resolve.outputs.artifact_run }}
        run: |
          python scripts/release/release.py verify bundle --version "$VERSION" --sha "$SOURCE_SHA" --run-id "$ARTIFACT_RUN"
          test "$(git rev-parse "refs/tags/$VERSION^{commit}")" = "$SOURCE_SHA"
      # TEMPORARY: remove after recovering 1.1.2. Keep the source checkout and
      # original bundle intact; only replace the broken GitHub publisher.
      - name: Apply one-time GitHub publisher fix for 1.1.2 recovery
        if: >-
          ${{ github.event_name == 'workflow_dispatch' &&
              github.ref == 'refs/heads/main' &&
              inputs.version == '1.1.2' && inputs.artifact_run == '43751786501' }}
        run: git show "$GITHUB_SHA:scripts/release/github_release.py" > scripts/release/github_release.py
      - name: Stage or verify immutable GitHub assets
        id: github_assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: python scripts/release/github_release.py stage bundle --version "$VERSION" --sha "$SOURCE_SHA"
      - name: Publish identical Python artifacts to PyPI
        id: pypi
        run: uv publish --trusted-publishing always bundle/*.whl bundle/*.tar.gz
      - name: Push validated packaging to AUR
        id: aur
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
        run: bash scripts/release/publish-aur.sh bundle
      - name: Make completed GitHub Release public
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: python scripts/release/github_release.py finish bundle --version "$VERSION" --sha "$SOURCE_SHA"
      - name: Publication summary
        if: always()
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ASSETS: ${{ steps.github_assets.outcome }}
          PYPI: ${{ steps.pypi.outcome }}
          AUR: ${{ steps.aur.outcome }}
          RELEASE: ${{ steps.github_release.outcome }}
        run: |
          {
            printf '## Release %s\n\n' "$VERSION"
            printf '| Channel | Result |\n|---|---|\n'
            printf '| GitHub assets | %s |\n| PyPI | %s |\n| AUR | %s |\n| Public release | %s |\n' "$ASSETS" "$PYPI" "$AUR" "$RELEASE"
            printf '\nRecovery must reuse this original release bundle; never move its tag.\n'
          } >> "$GITHUB_STEP_SUMMARY"
