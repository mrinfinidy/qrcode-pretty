name: Test release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-release.yaml
    with:
      sha: ${{ github.sha }}
      local_source: true

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: test-release
    permissions:
      id-token: write
      actions: read
      contents: read
    steps:
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.5'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: build-python
          path: dist
      - name: Publish tested artifacts to TestPyPI only
        run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/ --check-url https://test.pypi.org/simple/ dist/*
